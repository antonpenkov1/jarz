<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jarz — Home · Paper Glow · Carousel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { width: 430px; height: 932px; }
  body {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(140% 55% at 50% -5%, #FCFBF8 0%, rgba(252,251,248,0) 60%),
      #F7F6F2;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #171614;
    display: flex;
    flex-direction: column;
  }
  .serif { font-family: Georgia, "Times New Roman", serif; }

  /* ---------- status bar ---------- */
  .statusbar {
    height: 54px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px 0 38px;
    position: relative;
  }
  .sb-time { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 35px; border-radius: 20px; background: #0A0A09;
  }
  .sb-icons { display: flex; align-items: center; gap: 7px; }

  /* ---------- header ---------- */
  .header {
    flex: 0 0 auto;
    margin: 10px 20px 0;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .wordmark { font-family: Georgia, serif; font-size: 23px; letter-spacing: .2px; }
  .header .month { font-size: 12.5px; color: #A29B8C; letter-spacing: .4px; }

  /* ---------- food strip ---------- */
  .food {
    flex: 0 0 auto;
    margin: 13px 16px 0;
    background: #FFFFFF;
    border-radius: 24px;
    padding: 16px 18px;
    display: flex; align-items: center; gap: 15px;
    box-shadow:
      0 1px 2px rgba(90, 76, 48, .04),
      0 10px 26px -8px rgba(90, 76, 48, .10);
  }
  .ringwrap { position: relative; width: 58px; height: 58px; flex: 0 0 auto; }
  .ringwrap::before {
    content: ""; position: absolute; inset: 4px; border-radius: 50%;
    box-shadow: 0 0 22px 2px rgba(23,160,94,.22);
  }
  .ring-num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif; font-size: 14px; letter-spacing: -.2px;
  }
  .food-right { flex: 1; min-width: 0; }
  .food-line1 { font-size: 13.5px; font-weight: 590; margin-bottom: 8px; }
  .food-line1 .date { color: #A29B8C; font-weight: 400; }
  .runway { display: flex; gap: 2.5px; margin-bottom: 8px; }
  .runway i {
    flex: 1; height: 9px; border-radius: 2.5px;
    background: linear-gradient(180deg, #2AB873, #17A05E);
    box-shadow: 0 0 6px rgba(23,160,94,.42), 0 1px 2px rgba(23,160,94,.25);
  }
  .food-line2 { font-size: 11px; color: #A29B8C; letter-spacing: .2px; }
  .food-line2 b { color: #17A05E; font-weight: 600; }

  /* ---------- carousel ---------- */
  .carousel { flex: 0 0 auto; position: relative; height: 344px; margin-top: 17px; }
  .hero-underglow {
    position: absolute; left: 74px; width: 282px; bottom: -10px; height: 70px;
    background: radial-gradient(60% 100% at 50% 40%, rgba(223,160,50,.50), rgba(223,160,50,0) 70%);
    filter: blur(22px);
  }
  .track { position: absolute; left: -262px; top: 2px; display: flex; gap: 12px; }
  .jar {
    position: relative;
    width: 310px; height: 340px; flex: 0 0 auto;
    background: #FFFFFF;
    border-radius: 28px;
    overflow: hidden;
    box-shadow:
      0 1px 2px rgba(90,76,48,.05),
      0 8px 22px -6px rgba(90,76,48,.09);
  }
  .jar.side { transform: scale(.94); box-shadow: 0 6px 18px -6px rgba(90,76,48,.08); }
  .jar.hero {
    border: 1px solid rgba(223,160,50,.16);
    box-shadow:
      0 1px 2px rgba(90,76,48,.05),
      0 14px 34px -10px rgba(90,76,48,.13),
      0 26px 60px -18px rgba(223,160,50,.30);
  }

  /* liquid */
  .liquid { position: absolute; left: 0; right: 0; bottom: 0; }
  .liquid.amber {
    background: linear-gradient(180deg, rgba(223,160,50,.26) 0%, rgba(223,160,50,.13) 65%, rgba(223,160,50,.20) 100%);
    box-shadow: 0 -16px 36px -8px rgba(223,160,50,.38);
  }
  .liquid.green {
    background: linear-gradient(180deg, rgba(23,160,94,.20) 0%, rgba(23,160,94,.09) 65%, rgba(23,160,94,.15) 100%);
    box-shadow: 0 -16px 36px -8px rgba(23,160,94,.30);
  }
  .meniscus { position: absolute; left: 0; right: 0; width: 100%; height: 14px; display: block; }

  /* hero content */
  .jar-name {
    position: absolute; top: 22px; left: 24px;
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; letter-spacing: .2px;
  }
  .jar-name svg { filter: drop-shadow(0 0 5px rgba(223,160,50,.65)); }
  .jar-amount { position: absolute; top: 46px; left: 24px; display: flex; align-items: baseline; gap: 8px; }
  .jar-amount .big { font-family: Georgia, serif; font-size: 46px; letter-spacing: -1px; }
  .jar-amount .of { font-family: Georgia, serif; font-size: 17px; color: #B3AC9D; }
  .traj { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* side cards */
  .side .jar-amount .big { font-size: 32px; }
  .trips-block { position: absolute; top: 24px; left: 262px; width: 160px; }
  .trips-block .nm { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .trips-block .amt { font-family: Georgia, serif; font-size: 32px; letter-spacing: -.5px; white-space: nowrap; }

  /* dots */
  .dots { flex: 0 0 auto; margin-top: 13px; display: flex; justify-content: center; gap: 7px; align-items: center; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: #DAD6CB; }
  .dots i.on {
    width: 18px; background: linear-gradient(90deg, #1FB56C, #17A05E);
    box-shadow: 0 0 8px rgba(23,160,94,.55);
  }

  /* ---------- chips ---------- */
  .chips {
    flex: 0 0 auto;
    margin: 15px 16px 0;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px;
  }
  .chip {
    background: #FFFFFF; border-radius: 15px; padding: 9px 11px 10px;
    box-shadow: 0 1px 2px rgba(90,76,48,.04), 0 5px 14px -5px rgba(90,76,48,.08);
  }
  .chip .cn { font-size: 10px; color: #A29B8C; letter-spacing: .3px; margin-bottom: 2px;
              white-space: nowrap; overflow: hidden; }
  .chip .ca { font-family: Georgia, serif; font-size: 13.5px; margin-bottom: 6px; letter-spacing: -.2px; }
  .cbar { height: 4px; border-radius: 2px; background: #EFEDE6; overflow: visible; }
  .cbar i { display: block; height: 4px; border-radius: 2px; }
  .cbar .g { background: linear-gradient(90deg, #2AB873, #17A05E); box-shadow: 0 0 6px rgba(23,160,94,.45); }
  .cbar .a { background: linear-gradient(90deg, #E8B04A, #DFA032); box-shadow: 0 0 6px rgba(223,160,50,.5); }

  /* ---------- footer ---------- */
  .footer {
    flex: 0 0 auto;
    margin: auto 22px 126px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .footer .cap { font-size: 9.5px; letter-spacing: 1.4px; color: #A29B8C; font-weight: 600; margin-bottom: 3px; }
  .footer .total { font-family: Georgia, serif; font-size: 21px; letter-spacing: -.2px; }
  .footer .total small { font-size: 13px; color: #A29B8C; letter-spacing: .3px; }
  .recap {
    font-size: 13px; font-weight: 600; color: #17A05E; padding-bottom: 2px;
    text-shadow: 0 0 14px rgba(23,160,94,.35);
  }

  /* ---------- tab bar ---------- */
  .tabbar {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 30px;
    width: 374px; height: 66px; border-radius: 33px;
    background: rgba(255,255,255,.94);
    box-shadow:
      0 1px 2px rgba(90,76,48,.05),
      0 14px 34px -8px rgba(90,76,48,.16);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 10px;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #A6A091; width: 70px; position: relative; }
  .tab span { font-size: 9.5px; letter-spacing: .2px; font-weight: 500; }
  .tab.active { color: #17A05E; }
  .tab.active span { font-weight: 600; }
  .tab.active::before {
    content: ""; position: absolute; top: -4px; width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle, rgba(23,160,94,.20), rgba(23,160,94,0) 70%);
  }
  .tab.active svg { filter: drop-shadow(0 0 6px rgba(23,160,94,.5)); }

  .homebar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 5px; border-radius: 3px; background: #171614; opacity: .9;
  }
</style>
</head>
<body>

  <!-- STATUS BAR -->
  <div class="statusbar">
    <div class="sb-time">9:41</div>
    <div class="island"></div>
    <div class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#171614"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="4.7" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.4" y="3" width="3" height="9" rx="1"/><rect x="14.1" y="0.5" width="3" height="11.5" rx="1"/></g></svg>
      <svg width="17" height="12" viewBox="0 0 17 12"><g fill="#171614"><path d="M8.5 9.7a2 2 0 0 1 2 2l-2 .3-2-.3a2 2 0 0 1 2-2z"/><path d="M8.5 5.8c1.7 0 3.2.6 4.4 1.7l-1.5 1.6a4.2 4.2 0 0 0-5.8 0L4.1 7.5a6.4 6.4 0 0 1 4.4-1.7z"/><path d="M8.5 1.8c2.8 0 5.3 1 7.2 2.8l-1.5 1.6a8.4 8.4 0 0 0-11.4 0L1.3 4.6A10.5 10.5 0 0 1 8.5 1.8z"/></g></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="#171614" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="18" height="8" rx="2" fill="#171614"/><path d="M24.5 4.5v4a2.2 2.2 0 0 0 0-4z" fill="#171614" fill-opacity=".4"/></svg>
    </div>
  </div>

  <!-- HEADER -->

    <div class="wordmark">Jarz</div>
    <div class="month">September</div>

  <!-- FOOD STRIP -->
  <div class="food">
    <div class="ringwrap">
      <svg width="58" height="58" viewBox="0 0 58 58">

        <circle cx="29" cy="29" r="24" fill="none" stroke="#17A05E" stroke-width="5"
                stroke-linecap="round" stroke-dasharray="128.2 150.8"

    <div class="food-right">

  <!-- HERO CAROUSEL -->
  <div class="carousel">
    <div class="hero-underglow"></div>
    <div class="track">

      <!-- LEFT PEEK: TRIPS -->
      <div class="jar side">
        <div class="trips-block">
          <div class="nm">Trips</div>
          <div class="amt serif">25&#8201;000</div>
        </div>
        <div class="liquid amber" style="height: 85px;"></div>
        <svg class="meniscus" style="bottom: 85px;" viewBox="0 0 310 14" preserveAspectRatio="none">
          <path d="M0 11 Q78 3 155 8 Q232 13 310 6 L310 14 L0 14 Z" fill="rgba(223,160,50,.26)"/>
          <path d="M0 11 Q78 3 155 8 Q232 13 310 6" fill="none" stroke="rgba(223,160,50,.75)" stroke-width="1.6"/>

      </div>

      <!-- CENTER: SAVINGS (goal jar) -->

        </div>
        <div class="jar-amount">
          <span class="big">12&#8201;000</span>
          <span class="of">/ 60&#8201;000</span>
        </div>

        <div class="liquid amber" style="height: 68px;"></div>
        <svg class="meniscus" style="bottom: 68px;" viewBox="0 0 310 14" preserveAspectRatio="none">
          <path d="M0 11 Q78 3 155 8 Q232 13 310 6 L310 14 L0 14 Z" fill="rgba(223,160,50,.26)"/>
          <path d="M0 11 Q78 3 155 8 Q232 13 310 6" fill="none" stroke="rgba(223,160,50,.8)" stroke-width="1.8"/>
        </svg>

        <!-- projection trajectory -->
        <svg class="traj" viewBox="0 0 310 340">
          <defs>
            <filter id="trajGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="3"/>
            </filter>
          </defs>
          <!-- glow underlays -->
          <path d="M24 264 Q96 256 152 234" fill="none" stroke="#DFA032" stroke-width="7" opacity=".38" filter="url(#trajGlow)"/>
          <path d="M152 234 Q236 204 272 146" fill="none" stroke="#DFA032" stroke-width="6" opacity=".28" filter="url(#trajGlow)"/>
          <!-- past: solid -->
          <path d="M24 264 Q96 256 152 234" fill="none" stroke="#C98F26" stroke-width="2.4" stroke-linecap="round"/>
          <!-- future: dotted -->
          <path d="M152 234 Q236 204 272 146" fill="none" stroke="#C98F26" stroke-width="2.2"
                stroke-linecap="round" stroke-dasharray="0.5 7"/>
          <!-- past top-up dots -->
          <g>
            <circle cx="24" cy="264" r="6" fill="#DFA032" opacity=".35" filter="url(#trajGlow)"/>
            <circle cx="70" cy="257" r="6" fill="#DFA032" opacity=".35" filter="url(#trajGlow)"/>
            <circle cx="112" cy="248" r="6" fill="#DFA032" opacity=".35" filter="url(#trajGlow)"/>
            <circle cx="152" cy="234" r="6" fill="#DFA032" opacity=".35" filter="url(#trajGlow)"/>

            <circle cx="70" cy="257" r="3.4" fill="#C98F26" stroke="#FFFFFF" stroke-width="1.6"/>
            <circle cx="112" cy="248" r="3.4" fill="#C98F26" stroke="#FFFFFF" stroke-width="1.6"/>
            <circle cx="152" cy="234" r="3.4" fill="#C98F26" stroke="#FFFFFF" stroke-width="1.6"/>
          </g>
          <!-- flag at projected date -->
          <g>
            <circle cx="272" cy="146" r="7" fill="#DFA032" opacity=".4" filter="url(#trajGlow)"/>
            <line x1="272" y1="146" x2="272" y2="120" stroke="#C98F26" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M272 120 L288 124.5 L272 129 Z" fill="#DFA032"/>
            <circle cx="272" cy="146" r="3" fill="#C98F26" stroke="#FFFFFF" stroke-width="1.5"/>
            <text x="264" y="128" text-anchor="end" font-family="Georgia, serif" font-size="11.5" fill="#8A6A1F">&#8776; 14 Mar</text>
          </g>
          <!-- caption -->
          <text x="153" y="257" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#AFA795">at your pace</text>
        </svg>
      </div>

      <!-- RIGHT PEEK: SPORT -->
      <div class="jar side">
        <div class="jar-name" style="top: 20px;">Sport</div>
        <div class="jar-amount" style="top: 42px;">
          <span class="big">3&#8201;500</span>
        </div>
        <div class="liquid green" style="height: 289px;"></div>
        <svg class="meniscus" style="bottom: 289px;" viewBox="0 0 310 14" preserveAspectRatio="none">
          <path d="M0 11 Q78 3 155 8 Q232 13 310 6 L310 14 L0 14 Z" fill="rgba(23,160,94,.20)"/>
          <path d="M0 11 Q78 3 155 8 Q232 13 310 6" fill="none" stroke="rgba(23,160,94,.7)" stroke-width="1.6"/>
        </svg>

    </div>
  </div>

  <!-- PAGE DOTS -->

  <!-- ALL JARS CHIPS -->

    <div class="chip"><div class="cn">GIFTS</div><div class="ca">3&#8201;000</div><div class="cbar"><i class="g" style="width:25%"></i></div></div>

    <div class="chip"><div class="cn">SPORT</div><div class="ca">3&#8201;500</div><div class="cbar"><i class="g" style="width:85%"></i></div></div>

      </svg>

    </div>

      </svg>
      <span>Settings</span>
    </div>
  </div>

  <div class="homebar"></div>

</body>
</html>
