name: Jarz
options:
  bundleIdPrefix: com.antonpenkov
  deploymentTarget:
    iOS: "17.0"
schemes:
  Jarz:
    build:
      targets:
        Jarz: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JarzTests
    archive:
      config: Release
targets:
  Jarz:
    type: application
    platform: iOS
    sources:
      - Jarz
    dependencies:
      - target: JarzWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.jarz
        DEVELOPMENT_TEAM: 3UHRLQ9522
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconPaper AppIconJar
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: Jarz/Jarz.entitlements
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_NSFaceIDUsageDescription: Jarz locks your budget behind Face ID.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: Jarz
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.3
  JarzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JarzTests
    dependencies:
      - target: Jarz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.jarz.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 3UHRLQ9522
        SWIFT_VERSION: "5.9"
  JarzWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: JarzWidget
      - path: Jarz/Core/Models.swift
      - path: Jarz/Core/MoneyFormat.swift
      - path: Jarz/Core/WidgetShared.swift
      - path: Jarz/Core/StorageWorker.swift
      - path: Jarz/Core/Reminders.swift
      - path: Jarz/Core/Intents.swift
      - path: Jarz/Localizable.xcstrings
    info:
      path: JarzWidget/Info.plist
      properties:
        CFBundleDisplayName: Jarz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.jarz.widget
        DEVELOPMENT_TEAM: 3UHRLQ9522
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: JarzWidget/JarzWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.3
        SKIP_INSTALL: YES
